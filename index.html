<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>MWCLG</title>
     <style>
          body {
               font-size: 1rem;
               line-height: 1.5;
               margin: 2rem;
          }
          form {
               display: flex;
               flex-direction: column;
               max-width: 32rem;
          }
          label {
               display: block;
               font-size: 1.125rem;
               font-weight: 600;
               margin: 1.5rem 0 0.25rem 0;
          }
          small {
               display: block;
               font-size: 1rem;
               opacity: 0.65;
               margin: 0 0 0.5rem 0;
          }
          #international-code-row {
               display: flex;
               align-items: center;
               gap: 0.25rem;
          }
          input[type="number"],
          textarea {
               font-size: 1rem;
               font-family: inherit;
               padding: 0.5rem 0.75rem;
               border: 1px solid #888;
               border-radius: 0.5rem;
               outline: none;
          }
          input[type="number"]:focus,
          textarea:focus {
               border-color: #444;
               box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.2);
          }
          #international-code {
               width: 4rem;
               appearance: textfield;
          }
          #international-code::-webkit-outer-spin-button,
          #international-code::-webkit-inner-spin-button {
               -webkit-appearance: none;
               margin: 0;
          }
          textarea {
               height: 6rem;
               resize: vertical;
          }
          .buttons-row {
               display: flex;
               gap: 0.5rem;
               margin-top: 1.5rem;
          }
          button {
               font-size: 1rem;
               font-family: inherit;
               font-weight: 600;
               white-space: nowrap;
               padding: 0.5rem 1rem;
               border-radius: 0.5rem;
               border: 1px solid #888;
               cursor: pointer;
               background: none;
          }
          button:focus {
               outline: none;
               box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.2);
          }
     </style>
</head>
<body>

     <main>
          <form>
               <label for="international-code">Código de país</label>
               <div id="international-code-row">
                    <span>+</span><input type="number" name="international-code" id="international-code" value="54">
               </div>
               <label for="local-numbers">Números locales</label>
               <small id="local-numbers-hint">Cada uno separado por un espacio o salto de línea</small>
               <textarea name="local-numbers" id="local-numbers" aria-describedby="local-numbers-hint"></textarea>
               <label for="message">Mensaje</label>
               <textarea name="message" id="message"></textarea>
          </form>
          <div class="buttons-row">
               <button type="button" id="generate-links-button">Generar links</button>
               <button type="button" id="open-all-links-button">Abrir todos los links</button>
               <button type="button" id="remove-all-links-button">Eliminar todos los links</button>
          </div>
     </main>

     <section id="links-section" aria-label="Links generados"></section>

     <script type="module" src="index-scripts.js"></script>

</body>
</html>
